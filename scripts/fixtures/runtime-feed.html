<script>
window.fixtureEvents=[];window.fixtureStalled=false;
let index=Number(sessionStorage.getItem('fixtureIndex')||0);
function render(){document.querySelector('#video').setAttribute('data-e2e-vid',String(100000001+index));document.querySelector('#counter').textContent=index+' 次切换';}
function next(e){if(!e.isTrusted||window.fixtureStalled)return;if(e.type==='keydown'&&!['ArrowDown','r'].includes(e.key))return;index++;sessionStorage.setItem('fixtureIndex',index);window.fixtureEvents.push({at:Date.now(),type:e.type,trusted:e.isTrusted,index});render();}
addEventListener('keydown',next);addEventListener('wheel',next);render();
</script>
